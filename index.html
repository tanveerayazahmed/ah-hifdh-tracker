function model(entries){
  const T=today(),mem=new Uint8Array(NA+1),last=new Int32Array(NA+1);
  const ver=entries.filter(e=>e.status==="verified");
  for(const e of ver){const d=dnum(e.date),a=gid(e.surah,e.from),b=gid(e.surah,e.to);

    const n=pageAyat(p),age=c?T-mn:null;pages.push({p,c,n,full:c===n,age,str:c===n?(age<=7?3:age<=14?2:age<=30?1:0):null})}

  const pe=e=>{let s=0;for(let i=gid(e.surah,e.from);i<=gid(e.surah,e.to);i++)s+=1/pageAyat(pageOf(i));return s};
  const weeks={};for(const e of ver){if(e.kind==="prior")continue;const w=weekStart(dnum(e.date));const o=weeks[w]||(weeks[w]={nw:0,rv:0,mk:0,days:new Set()});

  const pendDays=new Set(entries.filter(e=>e.status==="pending").map(e=>dnum(e.date)));
  // milestones
  const surahsDone=[];for(let s=1;s<=114;s++){let ok=true;for(let i=Q.ss[s-1];i<Q.ss[s-1]+Q.sc[s-1];i++)if(!mem[i]){ok=false;break}if(ok)surahsDone.push(s)}
  const juzDone=[];for(let j=1;j<=30;j++){let ok=true;for(let i=Q.jz[j-1];i<Q.jz[j];i++)if(!mem[i]){ok=false;break}if(ok)juzDone.push(j)}
  // nudges
  const nudges=[];const lastNew=[...ver].reverse().find(e=>e.kind==="new");

    let rs=0;for(let i=Q.ss[s-1];i<Q.ss[s-1]+Q.sc[s-1];i++)if(!mem[i])rs++;

    const j=juzOfPage(p);let rj=0;for(let q=1;q<=NP;q++)if(juzOfPage(q)===j&&!pages[q-1].full)rj++;

}

  const mpp=m.cur.nw?(m.cur.mk/m.cur.nw):null,mppPrev=m.prev.nw?(m.prev.mk/m.prev.nw):null;
  const juzEq=m.full/20;
  let stairs="";for(let i=0;i<30;i++)stairs+=`<i class="${i<Math.floor(juzEq)?"on":""}" style="height:${12+i*2.6}px${i===Math.floor(juzEq)?`;background:linear-gradient(0deg,var(--gold) ${(juzEq%1)*100}%,#ece6d7 ${(juzEq%1)*100}%)`:""}"></i>`;
  let map="";for(const x of m.pages){const cls=x.full?"s"+x.str:x.c?"part":"";map+=`<i class="${cls}" ${x.c&&!x.full?`style="--p:${Math.round(x.c/x.n*100)}%"`:""} data-p="${x.p}"></i>`}
  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let dots="";for(let i=0;i<7;i++){const d=m.wk+i;dots+=`<span><b class="${m.cur.days.has(d)||m.pendDays.has(d)?"on":""} ${d===m.T?"today":""}"></b>${days[i]}</span>`}
  const beat=m.prev.nw>0&&m.cur.nw<m.prev.nw?`Beat last week: ${fmt(m.prev.nw-m.cur.nw)} more page${m.prev.nw-m.cur.nw>1?"s":""} to go`:m.cur.nw>0&&m.cur.nw>=m.best?"This is your best week so far. Keep going!":"";
  const pend=entries.filter(e=>e.status==="pending");
  const cg=cls?Math.min(100,Math.round(cls.done/Math.max(cls.target,1)*100)):0;
  return `
  <div class="card hadith"><div class="ar">اقْرَأْ وَارْتَقِ</div><p>"Recite and rise": your rank is at the last ayah you recite. (Abu Dawud, Tirmidhi)</p></div>
  <div class="card"><h3>${esc(name)}'s ascent</h3>
    <div class="row" style="align-items:flex-end"><div><div class="big">${fmt(juzEq)} <span class="mute" style="font-size:15px">of 30 juz</span></div><div class="mute">${m.full} pages · ${m.total} ayat memorised</div></div></div>
    <div class="stairs">${stairs}</div>
    ${m.juzDone.length||m.surahsDone.length?`<div class="ms">${m.juzDone.map(j=>`<span>Juz ${j} complete</span>`).join("")}${m.surahsDone.length?`<span>${m.surahsDone.length} surah${m.surahsDone.length>1?"s":""} complete</span>`:""}</div>`:""}
  </div>
  ${m.nudges.length?`<div class="card"><h3>So close</h3>${m.nudges.slice(0,3).map(n=>`<div class="nudge"><div class="n">${n.n}</div><div>${n.t}</div></div>`).join("")}</div>`:""}
  <div class="card"><h3>This week vs last week</h3>
    <div class="stats">
      <div class="stat"><b>${fmt(m.cur.nw)}</b><span>new pages ${trend(m.cur.nw,m.prev.nw)}</span></div>
      <div class="stat"><b>${fmt(m.cur.rv)}</b><span>pages revised ${trend(m.cur.rv,m.prev.rv)}</span></div>
      <div class="stat"><b>${mpp===null?"–":fmt(mpp)}</b><span>mistakes / page ${mpp!==null&&mppPrev!==null?(mpp<mppPrev?'<span class="up">better</span>':mpp>mppPrev?'<span class="down">more</span>':""):""}</span></div>
    </div>
    ${beat?`<p style="margin:10px 0 0;font-weight:600;color:var(--g)">${beat}</p>`:""}
    <p class="mute" style="margin:8px 0 4px">Days practised this week</p><div class="dots">${dots}</div>
    <p class="mute" style="margin:8px 0 0">Personal best week: ${fmt(m.best)} new pages</p>
  </div>
  ${m.fading.length?`<div class="card"><h3>Needs revision before it fades</h3><div class="list">${m.fading.slice(0,5).map(x=>`<div class="it"><div><b>Page ${x.p}</b> <span class="mute">${esc(surahsOnPage(x.p))}</span></div><span class="pill">${x.age} days</span></div>`).join("")}</div>${m.fading.length>5?`<p class="mute">+${m.fading.length-5} more pages</p>`:""}</div>`:""}
  <div class="card"><h3>The Mushaf: 604 pages</h3>
    <div class="map" id="map">${map}</div>
    <div class="legend"><span><i style="background:var(--g)"></i>Strong (≤7 days)</span><span><i style="background:var(--g2)"></i>Good (≤14)</span><span><i style="background:var(--g3)"></i>Weak (≤30)</span><span><i style="background:var(--fade);outline:1.5px solid var(--warn)"></i>Fading (30+)</span><span><i style="background:linear-gradient(0deg,var(--g3) 50%,#ebe5d6 50%)"></i>In progress</span></div>
    <p class="mute" style="margin:8px 0 0">Each square is one page. Pages fade if not revised. Tap a square for details.</p>
  </div>
  ${cls?`<div class="card"><h3>${esc(cls.label)} · whole class</h3><div class="bar"><i style="width:${cg}%"></i></div><p class="mute" style="margin:6px 0 0">${cls.done} of ${cls.target} new ayat together since ${cls.start} (${cg}%)</p></div>`:""}
  ${pend.length?`<div class="card"><h3>Waiting for teacher</h3><div class="list">${pend.map(e=>`<div class="it"><div>${e.kind==="new"?"New":"Revision"}: ${esc(EN[e.surah-1])} ${e.from}–${e.to} <span class="mute">· ${e.date}</span></div><span class="pill">pending</span></div>`).join("")}</div></div>`:""}`;
}
function bindMap(entries){
  const m=model(entries),map=$("#map");if(!map)return;let tip;
  map.onclick=ev=>{const p=+ev.target.dataset.p;if(!p)return;const x=m.pages[p-1];tip&&tip.remove();tip=document.createElement("div");tip.className="tip";
    tip.innerHTML=`Page ${p} · Juz ${juzOfPage(p)}<br>${esc(surahsOnPage(p))}<br>${x.c}/${x.n} ayat${x.c?` · last practised ${x.age} day${x.age===1?"":"s"} ago`:""}`;
    document.body.appendChild(tip);const r=ev.target.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-230,r.left-100))+"px";tip.style.top=(r.top+scrollY-70)+"px";setTimeout(()=>tip&&tip.remove(),3500)};
}
function weeklyText(name,entries){
  const m=model(entries);const ver=entries.filter(e=>e.status==="verified"&&e.kind!=="prior"&&dnum(e.date)>=m.wk);
  const nw=ver.filter(e=>e.kind==="new").map(e=>`${EN[e.surah-1]} ${e.from}-${e.to}`);
  let t=`Assalamu alaikum. Weekly Hifdh update for ${name}:\n\nNew memorisation: ${nw.length?nw.join(", "):"none this week"} (${fmt(m.cur.nw)} pages)\nRevision: ${fmt(m.cur.rv)} pages\nMistakes per page: ${m.cur.nw?fmt(m.cur.mk/m.cur.nw):"-"}\nDays practised: ${m.cur.days.size}\nTotal: ${fmt(m.full/20)} juz (${m.full} pages)`;
  if(m.fading.length)t+=`\n\nPlease revise at home: ${m.fading.slice(0,3).map(x=>`page ${x.p} (${surahsOnPage(x.p)})`).join("; ")}`;
  if(m.nudges[0])t+=`\nNext target: ${m.nudges[0].t}`;
  return t+"\n\nJazakAllahu khairan";
}
function entryForm(id,kinds){
  let o="";for(let s=1;s<=114;s++)o+=`<option value="${s}">${sname(s)}</option>`;
  return `<div id="${id}"><div class="row"><div><label>Type</label><select name="kind">${kinds.map(k=>`<option value="${k[0]}">${k[1]}</option>`).join("")}</select></div>
  <div><label>Date</label><input type="date" name="date" value="${dstr(today())}"></div></div>
  <label>Surah</label><select name="surah">${o}</select>
  <div class="row"><div><label>From ayah</label><input type="number" name="from" min="1" value="1" inputmode="numeric"></div><div><label>To ayah</label><input type="number" name="to" min="1" value="1" inputmode="numeric"></div></div>
  <div class="row" style="margin-top:6px"><button type="button" class="ghost small" data-whole>Whole surah</button><span class="mute" data-info style="align-self:center"></span></div>
  <label>Mistakes</label><div class="row"><button type="button" class="ghost" data-m="-1" style="flex:0 0 52px">−</button><input type="number" name="mistakes" value="0" min="0" style="text-align:center"><button type="button" class="ghost" data-m="1" style="flex:0 0 52px">+</button></div>
  <button type="button" data-save style="width:100%;margin-top:12px">Save</button><div class="err" data-err></div></div>`;
}
function bindForm(id,onSave){
  const f=$("#"+id),g=n=>f.querySelector(`[name=${n}]`);
  const info=()=>{const s=+g("surah").value;f.querySelector("[data-info]").textContent=`${Q.sc[s-1]} ayat in this surah`};
  g("surah").onchange=()=>{info();g("from").value=1;g("to").value=1};info();
  f.querySelector("[data-whole]").onclick=()=>{g("from").value=1;g("to").value=Q.sc[+g("surah").value-1]};
  f.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{g("mistakes").value=Math.max(0,(+g("mistakes").value||0)+ +b.dataset.m)});
  f.querySelector("[data-save]").onclick=async ev=>{const s=+g("surah").value,a=+g("from").value,b=+g("to").value,err=f.querySelector("[data-err]");err.textContent="";
    if(!(a>=1&&b>=a&&b<=Q.sc[s-1])){err.textContent=`Check the ayah numbers (1–${Q.sc[s-1]}, "to" not less than "from").`;return}
    ev.target.disabled=true;try{await onSave({kind:g("kind").value,surah:s,from:a,to:b,mistakes:+g("mistakes").value||0,date:g("date").value})}catch(e){err.textContent=e.message}ev.target.disabled=false};
}

/* ---------- views ---------- */
const head=(sub,out)=>`<header><div class="brand">AH Hifdh Tracker<small>${sub}</small></div>${out?`<button class="ghost small" id="out">Log out</button>`:""}</header>`;
function home(){
  app.innerHTML=head("Al Hikmah Boys")+`<div class="card hadith"><div class="ar" style="font-size:30px">اقْرَأْ وَارْتَقِ</div><p>Recite and rise</p></div>
  <div class="choose"><button id="gp">I'm a parent</button><button class="ghost" id="gt">I'm the teacher</button></div>`;
  $("#gp").onclick=()=>parentLogin();$("#gt").onclick=()=>teacherLogin();
}
function parentLogin(){
  const s=S.get("par");if(s)return parentView(s);
  app.innerHTML=head("Parent login")+`<div class="card"><h2>Parent login</h2><p class="mute">Use the code and PIN the teacher gave you.</p>
  <label>Son's code</label><input id="pc" placeholder="AHB123" autocapitalize="characters"><label>PIN</label><input id="pp" type="password" inputmode="numeric" maxlength="8">
  <button id="pl" style="width:100%;margin-top:12px">Open</button><div class="err" id="pe"></div><p><a href="#" id="back">← Back</a></p></div>`;
  $("#back").onclick=e=>{e.preventDefault();home()};
  $("#pl").onclick=async()=>{const c={code:$("#pc").value.trim().toUpperCase(),pin:$("#pp").value.trim()};try{const d=await rpc("parent_get",{p_code:c.code,p_pin:c.pin});S.set("par",c);parentView(c,d)}catch(e){$("#pe").textContent=e.message}};
}
async function parentView(c,d){
  try{d=d||await rpc("parent_get",{p_code:c.code,p_pin:c.pin})}catch(e){S.del("par");return parentLogin()}
  app.innerHTML=head(esc(d.boy.name),1)+`<button id="lg" style="width:100%;margin-bottom:12px;padding:14px">+ Log today's Hifdh</button><div class="card" id="lgc" style="display:none"><h2>Log today's Hifdh</h2>${entryForm("pf",[["new","New lesson"],["revision","Revision"]])}<p class="mute" style="margin:8px 0 0">The teacher checks each entry before it counts.</p></div>`+dashboard(d.boy.name,d.entries,d.class);
  $("#out").onclick=()=>{S.del("par");home()};bindMap(d.entries);$("#lg").onclick=()=>{$("#lgc").style.display="block";$("#lg").style.display="none"};
  bindForm("pf",async v=>{const r=await rpc("parent_add",{p_code:c.code,p_pin:c.pin,p_kind:v.kind,p_surah:v.surah,p_from:v.from,p_to:v.to,p_mistakes:v.mistakes,p_date:v.date});toast("Saved. Waiting for teacher to verify.");parentView(c,r)});
}
async function teacherLogin(){
  const s=S.get("tch");if(s)return teacherView(s);
  let st;try{st=await rpc("teacher_status")}catch(e){app.innerHTML=head("")+`<div class="card err">${esc(e.message)}</div>`;return}
  app.innerHTML=head("Teacher")+`<div class="card"><h2>${st.setup?"Teacher login":"First-time setup"}</h2>${st.setup?"":"<p class='mute'>Choose a teacher PIN (at least 6 digits). Keep it private.</p>"}
  <label>Teacher PIN</label><input id="tp" type="password" inputmode="numeric">${st.setup?"":`<label>Repeat PIN</label><input id="tp2" type="password" inputmode="numeric">`}
  <button id="tl" style="width:100%;margin-top:12px">${st.setup?"Open":"Set PIN"}</button><div class="err" id="te"></div><p><a href="#" id="back">← Back</a></p></div>`;
  $("#back").onclick=e=>{e.preventDefault();home()};
  $("#tl").onclick=async()=>{const pin=$("#tp").value.trim();try{if(!st.setup){if(pin!==$("#tp2").value.trim())throw new Error("PINs don't match");await rpc("teacher_setup",{p_pin:pin})}
    const d=await rpc("teacher_get",{p_pin:pin});S.set("tch",pin);teacherView(pin,d)}catch(e){$("#te").textContent=e.message}};
}
let TAB="verify";
async function teacherView(pin,d){
  try{d=d||await rpc("teacher_get",{p_pin:pin})}catch(e){S.del("tch");return teacherLogin()}
  const pend=[];for(const b of d.boys)for(const e of b.entries)if(e.status==="pending")pend.push({...e,boy:b});
  pend.sort((a,b)=>a.date<b.date?-1:1);
  const tabs=`<div class="tabs"><button data-t="verify" class="${TAB==="verify"?"on":""}">To verify (${pend.length})</button><button data-t="boys" class="${TAB==="boys"?"on":""}">Boys (${d.boys.filter(b=>b.active).length})</button><button data-t="class" class="${TAB==="class"?"on":""}">Class &amp; settings</button></div>`;
  let body="";
  if(TAB==="verify")body=pend.length?`<div class="card list">${pend.map(e=>`<div class="it" style="flex-wrap:wrap"><div style="flex:1 1 200px"><b>${esc(e.boy.name)}</b> · ${e.kind==="new"?"New":"Revision"}<br>${esc(sname(e.surah))} ${e.from}–${e.to} <span class="mute">· ${e.date}</span></div>
    <div class="row" style="flex:0 0 auto;align-items:center"><input type="number" min="0" value="${e.mistakes}" data-mk="${e.id}" style="width:64px" title="Mistakes"><button class="small" data-v="${e.id}">Verify</button><button class="small ghost" data-r="${e.id}">Reject</button></div></div>`).join("")}</div>`
    :`<div class="card mute">Nothing waiting. All entries are verified.</div>`;
  if(TAB==="boys"){
    body=`<div class="card"><h2>Add a boy</h2><div class="row"><input id="nb" placeholder="Full name"><button id="ab" style="flex:0 0 auto">Add</button></div><div id="newcode"></div></div><div class="card list">`+
    d.boys.map(b=>{const m=model(b.entries);const lastD=b.entries.filter(e=>e.status==="verified"&&e.kind!=="prior").map(e=>dnum(e.date)).sort().pop();
      return `<div class="it" style="cursor:pointer" data-b="${b.id}"><div><b>${esc(b.name)}</b>${b.active?"":" <span class='pill'>inactive</span>"}<br><span class="mute">${fmt(m.full/20)} juz · this week ${fmt(m.cur.nw)} new pg · ${m.fading.length} fading · ${lastD?`last ${m.T-lastD}d ago`:"no sessions yet"}</span></div><span class="mute">›</span></div>`}).join("")+`</div>`;
  }
  if(TAB==="class")body=`<div class="card"><h2>Class goal</h2><p class="mute">The boys see one shared bar, not a ranking. Counts verified new ayat from all boys since the start date.</p>
    <label>Goal name</label><input id="gl" value="${esc(d.class.label)}"><div class="row"><div><label>Target (ayat)</label><input id="gtg" type="number" value="${d.class.target}"></div><div><label>Start date</label><input id="gs" type="date" value="${d.class.start}"></div></div>
    <div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,d.class.done/d.class.target*100)}%"></i></div><p class="mute">${d.class.done} of ${d.class.target}</p><button id="sg">Save goal</button></div>
    <div class="card"><h2>Change teacher PIN</h2><div class="row"><input id="np" type="password" inputmode="numeric" placeholder="New PIN (6+ digits)"><button id="cp" style="flex:0 0 auto">Change</button></div></div>`;
  app.innerHTML=head("Teacher",1)+tabs+body;
  $("#out").onclick=()=>{S.del("tch");home()};
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;teacherView(pin,d)});
  app.querySelectorAll("[data-v],[data-r]").forEach(b=>b.onclick=async()=>{b.disabled=true;const id=+(b.dataset.v||b.dataset.r);
    try{const r=await rpc("teacher_review",{p_pin:pin,p_id:id,p_status:b.dataset.v?"verified":"rejected",p_mistakes:+app.querySelector(`[data-mk="${id}"]`).value||0});teacherView(pin,r)}catch(e){toast(e.message);b.disabled=false}});
  app.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>boyView(pin,d,x.dataset.b));
  if($("#ab"))$("#ab").onclick=async()=>{try{const r=await rpc("teacher_add_boy",{p_pin:pin,p_name:$("#nb").value});const nm=$("#nb").value;const d2=await rpc("teacher_get",{p_pin:pin});teacherView(pin,d2);
    $("#newcode").innerHTML=`<p>Give these to ${esc(nm)}'s parent (shown once):</p><div class="row"><div><label>Code</label><div class="code">${r.code}</div></div><div><label>PIN</label><div class="code">${r.pin}</div></div></div>`}catch(e){toast(e.message)}};
  if($("#sg"))$("#sg").onclick=async()=>{try{const r=await rpc("teacher_set_goal",{p_pin:pin,p_label:$("#gl").value,p_target:+$("#gtg").value,p_start:$("#gs").value});toast("Goal saved");teacherView(pin,r)}catch(e){toast(e.message)}};
  if($("#cp"))$("#cp").onclick=async()=>{const n=$("#np").value.trim();try{await rpc("teacher_change_pin",{p_pin:pin,p_new:n});S.set("tch",n);toast("PIN changed");teacherView(n)}catch(e){toast(e.message)}};
}
function boyView(pin,d,id){
  const b=d.boys.find(x=>x.id===id);if(!b)return teacherView(pin);
  let so="";for(let s=1;s<=114;s++)so+=`<option value="${s}">${sname(s)}</option>`;
  const hist=[...b.entries].reverse().slice(0,25);
  app.innerHTML=head(esc(b.name),1)+`<p><a href="#" id="bk">← All boys</a></p>
  <div class="card"><h2>Add a verified entry</h2>${entryForm("tf",[["new","New lesson"],["revision","Revision"]])}</div>
  ${dashboard(b.name,b.entries,d.class)}
  <div class="card"><h2>Weekly report for parent</h2><textarea id="wr" style="width:100%;height:170px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px">${esc(weeklyText(b.name,b.entries))}</textarea>
    <div class="row"><button id="cpy">Copy</button><a class="btn" style="text-align:center;text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(weeklyText(b.name,b.entries))}">WhatsApp</a></div></div>
  <div class="card"><h2>Already memorised (before using the tracker)</h2><p class="mute">Marks whole surahs as memorised, e.g. 78 to 114 for Juz Amma.</p>
    <div class="row"><div><label>From surah</label><select id="ps1">${so}</select></div><div><label>To surah</label><select id="ps2">${so}</select></div></div>
    <button id="pr" style="margin-top:10px">Add</button></div>
  <div class="card"><h2>History</h2><div class="list">${hist.map(e=>`<div class="it"><div>${e.kind==="new"?"New":e.kind==="revision"?"Revision":"Already memorised"}: ${esc(EN[e.surah-1])} ${e.from}–${e.to}<br><span class="mute">${e.date} · ${e.mistakes} mistakes · by ${e.source}</span></div><div class="row" style="flex:0 0 auto;align-items:center"><span class="pill ${e.status==="verified"?"v":""}">${e.status}</span><button class="small ghost" data-del="${e.id}">Delete</button></div></div>`).join("")||"<p class='mute'>No entries yet.</p>"}</div></div>
  <div class="card"><h2>Parent access</h2><div class="row"><button class="ghost" id="rp">Reset parent PIN</button><button class="ghost" id="ia">${b.active?"Mark inactive":"Mark active"}</button></div><div id="rpo"></div><p class="mute">Code: <b>${b.code}</b></p></div>`;
  $("#ps1").value=78;$("#ps2").value=114;
  $("#bk").onclick=e=>{e.preventDefault();TAB="boys";teacherView(pin,d)};$("#out").onclick=()=>{S.del("tch");home()};bindMap(b.entries);
  const reload=r=>boyView(pin,r,id);
  bindForm("tf",async v=>{const r=await rpc("teacher_add",{p_pin:pin,p_boy:id,p_kind:v.kind,p_surah:v.surah,p_from:v.from,p_to:v.to,p_mistakes:v.mistakes,p_date:v.date});toast("Saved");reload(r)});
  $("#cpy").onclick=()=>{navigator.clipboard.writeText($("#wr").value).then(()=>toast("Copied"),()=>{$("#wr").select();toast("Select and copy")})};
  $("#pr").onclick=async()=>{const a=+$("#ps1").value,z=+$("#ps2").value;if(z<a)return toast("'To' must be after 'From'");if(!confirm(`Mark surahs ${a} to ${z} as already memorised?`))return;try{reload(await rpc("teacher_add_prior",{p_pin:pin,p_boy:id,p_from_surah:a,p_to_surah:z}))}catch(e){toast(e.message)}};
  app.querySelectorAll("[data-del]").forEach(x=>x.onclick=async()=>{if(!confirm("Delete this entry?"))return;try{reload(await rpc("teacher_delete",{p_pin:pin,p_id:+x.dataset.del}))}catch(e){toast(e.message)}});
  $("#rp").onclick=async()=>{if(!confirm("Create a new PIN? The old one will stop working."))return;try{const r=await rpc("teacher_reset_pin",{p_pin:pin,p_boy:id});$("#rpo").innerHTML=`<p>New PIN (shown once):</p><div class="code">${r.pin}</div>`}catch(e){toast(e.message)}};
  $("#ia").onclick=async()=>{try{reload(await rpc("teacher_update_boy",{p_pin:pin,p_boy:id,p_name:null,p_active:!b.active}))}catch(e){toast(e.message)}};
}
home();
</script>
</body>
</html>
