function model(entries){
  const T=today(),mem=new Uint8Array(NA+1),last=new Int32Array(NA+1);
  const ver=entries.filter(e=>e.status==="verified");
  for(const e of ver){const d=dnum(e.date),a=gid(e.surah,e.from),b=gid(e.surah,e.to);
    for(let i=a;i<=b;i++){if(e.kind!=="revision")mem[i]=1;if(d>last[i])last[i]=d}}
  const pages=[];let total=0;
  for(let p=1;p<=NP;p++){let c=0,mn=1e9;for(let i=Q.pg[p-1];i<Q.pg[p];i++)if(mem[i]){c++;total++;if(last[i]<mn)mn=last[i]}
    const n=pageAyat(p),age=c?T-mn:null;pages.push({p,c,n,full:c===n,age,str:c===n?(age<=7?3:age<=14?2:age<=30?1:0):null})}
  const full=pages.filter(x=>x.full).length;
  // weekly
  const pe=e=>{let s=0;for(let i=gid(e.surah,e.from);i<=gid(e.surah,e.to);i++)s+=1/pageAyat(pageOf(i));return s};
  const weeks={};for(const e of ver){if(e.kind==="prior")continue;const w=weekStart(dnum(e.date));const o=weeks[w]||(weeks[w]={nw:0,rv:0,mk:0,days:new Set()});
    const v=pe(e);if(e.kind==="new"){o.nw+=v;o.mk+=e.mistakes}else o.rv+=v;o.days.add(dnum(e.date))}
  const wk=weekStart(T),cur=weeks[wk]||{nw:0,rv:0,mk:0,days:new Set()},prev=weeks[wk-7]||{nw:0,rv:0,mk:0,days:new Set()};
  const best=Math.max(0,...Object.values(weeks).map(o=>o.nw));
  const pendDays=new Set(entries.filter(e=>e.status==="pending").map(e=>dnum(e.date)));
  // milestones
  const surahsDone=[];for(let s=1;s<=114;s++){let ok=true;for(let i=Q.ss[s-1];i<Q.ss[s-1]+Q.sc[s-1];i++)if(!mem[i]){ok=false;break}if(ok)surahsDone.push(s)}
  const juzDone=[];for(let j=1;j<=30;j++){let ok=true;for(let i=Q.jz[j-1];i<Q.jz[j];i++)if(!mem[i]){ok=false;break}if(ok)juzDone.push(j)}
  // nudges
  const nudges=[];const lastNew=[...ver].reverse().find(e=>e.kind==="new");
  if(lastNew){const s=lastNew.surah,end=gid(s,lastNew.to);
    let rs=0;for(let i=Q.ss[s-1];i<Q.ss[s-1]+Q.sc[s-1];i++)if(!mem[i])rs++;
    const p=pageOf(Math.min(end+1,NA));const pg=pages[p-1];const rp=pg.n-pg.c;
    if(rp>0)nudges.push({n:rp,t:`${rp} ${rp>1?"ayat":"ayah"} left to finish page ${p}`});
    if(rs>0)nudges.push({n:rs,t:`${rs} ${rs>1?"ayat":"ayah"} left to complete Surah ${EN[s-1]}`});
    const j=juzOfPage(p);let rj=0;for(let q=1;q<=NP;q++)if(juzOfPage(q)===j&&!pages[q-1].full)rj++;
    if(rj>0)nudges.push({n:rj,t:`${rj} page${rj>1?"s":""} left to complete Juz ${j}`});}
  const fading=pages.filter(x=>x.full&&x.str<=1).sort((a,b)=>b.age-a.age);
  return {T,mem,pages,total,full,cur,prev,best,weeks,wk,pendDays,surahsDone,juzDone,nudges,fading,pe};
}
const surahsOnPage=p=>{const a=surahOf(Q.pg[p-1]),b=surahOf(Q.pg[p]-1);const r=[];for(let s=a;s<=b;s++)r.push(EN[s-1]);return r.join(", ")};
const fmt=v=>v>=10?Math.round(v):Math.round(v*10)/10;

function classProgress(cls){
  const st=dnum(cls.start),items=cls.items||[],by={};
  for(const e of items)(by[e.b]=by[e.b]||[]).push(e);
  let pe=0;const comp={},prog={};
  for(const b in by){const L=by[b],touched=new Set();
    for(const e of L)if(e.k==="new"&&dnum(e.d)>=st){touched.add(e.s);for(let a=e.f;a<=e.t;a++)pe+=1/pageAyat(pageOf(gid(e.s,a)))}
    for(const s of touched){const have=new Set();for(const e of L)if(e.s===s)for(let a=e.f;a<=e.t;a++)have.add(a);
      if(have.size>=Q.sc[s-1])comp[s]=(comp[s]||0)+1;else{const p=prog[s]||(prog[s]={s,have:0,n:0});p.have+=have.size;p.n++}}}
  const surahs=Object.values(comp).reduce((a,b)=>a+b,0),juz=pe/20;
  const done=cls.unit==="surah"?surahs:juz;
  return {done,juz,surahs,comp,prog:Object.values(prog),pct:Math.min(100,Math.round(done/Math.max(cls.target,0.5)*100)),unitLabel:cls.unit==="surah"?"surahs":"juz"};
}
function classCard(cls,detail){
  const c=classProgress(cls);

  <p style="margin:8px 0 0"><b>${fmt(c.done)} of ${fmt(+cls.target)} ${c.unitLabel}</b> <span class="mute">since ${cls.start} (${c.pct}%)</span></p>
  <p class="mute" style="margin:4px 0 0">${c.surahs} surah${c.surahs===1?"":"s"} completed · ${fmt(c.juz)} juz of new memorisation</p>`;
  if(detail){const cs=Object.keys(c.comp).map(Number).sort((a,b)=>a-b);
    if(cs.length)h+=`<p class="mute" style="margin:12px 0 4px">Completed</p><div class="list">${cs.map(s=>`<div class="it"><div>${esc(sname(s))}</div><span class="pill v">${c.comp[s]} boy${c.comp[s]>1?"s":""}</span></div>`).join("")}</div>`;
    if(c.prog.length)h+=`<p class="mute" style="margin:12px 0 4px">In progress</p><div class="list">${c.prog.sort((a,b)=>a.s-b.s).map(p=>`<div class="it"><div>${esc(sname(p.s))}<br><span class="mute">${p.have} of ${Q.sc[p.s-1]*p.n} ayat${p.n>1?` (${p.n} boys)`:""}</span></div><span class="pill">${Math.round(p.have/(Q.sc[p.s-1]*p.n)*100)}%</span></div>`).join("")}</div>`;}
  return h+`</div>`;
}

  let o="";for(let s=1;s<=114;s++)o+=`<option value="${s}">${sname(s)}</option>`;
  let jo="";for(let j=1;j<=30;j++)jo+=`<option value="${j}">Juz ${j}</option>`;
  return `<div class="tabs" style="margin:0" data-modes><button type="button" data-mode="part" class="on">Part of a surah</button><button type="button" data-mode="surah">Whole surah</button><button type="button" data-mode="juz">Whole juz</button></div>
  <div data-p="part"><label>Surah</label><select name="surah">${o}</select>
    <div class="row"><div><label>From ayah</label><select name="from"></select></div><div><label>To ayah</label><select name="to"></select></div></div>
    <p class="mute" data-info style="margin:6px 0 0"></p></div>
  <div data-p="surah" style="display:none"><div class="row"><div><label>From surah</label><select name="s1">${o}</select></div><div><label>To surah</label><select name="s2">${o}</select></div></div>
    <p class="mute" style="margin:6px 0 0">For one surah, choose the same surah in both.</p></div>
  <div data-p="juz" style="display:none"><div class="row"><div><label>From juz</label><select name="j1">${jo}</select></div><div><label>To juz</label><select name="j2">${jo}</select></div></div>
    <p class="mute" style="margin:6px 0 0">For one juz, choose the same juz in both.</p></div>`;
}
function bindSelectors(f){
  const g=n=>f.querySelector(`[name=${n}]`);let mode="part";
  const info=()=>{const s=+g("surah").value;f.querySelector("[data-info]").textContent=`${EN[s-1]} has ${Q.sc[s-1]} ayat`};
  const fill=()=>{const n=Q.sc[+g("surah").value-1];let o="";for(let a=1;a<=n;a++)o+=`<option value="${a}">${a}</option>`;g("from").innerHTML=o;g("to").innerHTML=o;g("to").value=n};
  g("surah").onchange=()=>{info();fill()};info();fill();
  g("from").onchange=()=>{if(+g("to").value<+g("from").value)g("to").value=g("from").value};
  g("s1").onchange=()=>{if(+g("s2").value<+g("s1").value)g("s2").value=g("s1").value};
  g("j1").onchange=()=>{if(+g("j2").value<+g("j1").value)g("j2").value=g("j1").value};
  f.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;f.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));f.querySelectorAll("[data-p]").forEach(p=>p.style.display=p.dataset.p===mode?"":"none")});
  return kind=>{let items=[];
    if(mode==="part"){const s=+g("surah").value,a=+g("from").value,b=+g("to").value;
      if(!(a>=1&&b>=a&&b<=Q.sc[s-1]))return {err:`Check the ayah numbers (1–${Q.sc[s-1]}, "to" not less than "from").`};items=[{kind,surah:s,f:a,t:b}]}
    else if(mode==="surah"){const a=+g("s1").value,b=+g("s2").value;if(b<a)return {err:"'To surah' must not be before 'From surah'."};for(let s=a;s<=b;s++)items.push({kind,surah:s,f:1,t:Q.sc[s-1]})}
    else{const a=+g("j1").value,b=+g("j2").value;if(b<a)return {err:"'To juz' must not be before 'From juz'."};items=juzItems(a,b,kind)}
    const label=mode==="juz"?(+g("j1").value===+g("j2").value?`Juz ${g("j1").value}`:`Juz ${g("j1").value}–${g("j2").value}`):mode==="surah"?(+g("s1").value===+g("s2").value?EN[g("s1").value-1]:`${EN[g("s1").value-1]} to ${EN[g("s2").value-1]}`):`${EN[g("surah").value-1]} ${g("from").value}–${g("to").value}`;
    return {items,label}};
}
function entryForm(id,kinds){
  return `<div id="${id}"><div class="row"><div><label>Type</label><select name="kind">${kinds.map(k=>`<option value="${k[0]}">${k[1]}</option>`).join("")}</select></div>
  <div><label>Date</label><input type="date" name="date" value="${dstr(today())}"></div></div>
  <label>Memorised as</label>${selectors()}
  <label>Mistakes</label><div class="row"><button type="button" class="ghost" data-m="-1" style="flex:0 0 52px">−</button><input type="number" name="mistakes" value="0" min="0" style="text-align:center"><button type="button" class="ghost" data-m="1" style="flex:0 0 52px">+</button></div>
  <button type="button" data-save style="width:100%;margin-top:12px">Save</button><div class="err" data-err></div></div>`;
}
function bindForm(id,onSave){
  const f=$("#"+id),g=n=>f.querySelector(`[name=${n}]`),read=bindSelectors(f);
  f.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{g("mistakes").value=Math.max(0,(+g("mistakes").value||0)+ +b.dataset.m)});
  f.querySelector("[data-save]").onclick=async ev=>{const err=f.querySelector("[data-err]");err.textContent="";const r=read(g("kind").value);
    if(r.err){err.textContent=r.err;return}if(r.items.length>150){err.textContent="That's too much for one entry. Please split it.";return}
    ev.target.disabled=true;try{await onSave({items:r.items,mistakes:+g("mistakes").value||0,date:g("date").value})}catch(e){err.textContent=e.message}ev.target.disabled=false};
}
function goalProgress(goal,mem){
  if(!goal||!goal.items||!goal.items.length)return null;
  const bys={};for(const it of goal.items){const o=bys[it.surah]||(bys[it.surah]={s:it.surah,set:new Set()});for(let a=it.f;a<=it.t;a++)o.set.add(a)}
  let tot=0,have=0;const rows=Object.values(bys).sort((a,b)=>a.s-b.s).map(o=>{let h=0;for(const a of o.set)if(mem[gid(o.s,a)])h++;tot+=o.set.size;have+=h;
    const arr=[...o.set].sort((x,y)=>x-y);return {s:o.s,n:o.set.size,h,whole:o.set.size===Q.sc[o.s-1],from:arr[0],to:arr[arr.length-1]}});
  const done=rows.filter(r=>r.h===r.n).length;
  return {rows,tot,have,done,pct:tot?Math.round(have/tot*100):0,next:rows.find(r=>r.h<r.n)};
}
function goalCard(goal,mem,name){
  const g=goalProgress(goal,mem);
  if(!g)return `<div class="card"><h3>Hifdh goal</h3><p class="mute" style="margin:0">No goal set yet. The teacher will set ${esc(name)}'s goal.</p></div>`;
  return `<div class="card"><h3>Hifdh goal</h3><h2 style="margin:0 0 6px">${esc(goal.label)}</h2>
  <div class="bar"><i style="width:${g.pct}%"></i></div>
  <p style="margin:8px 0 0"><b>${g.done} of ${g.rows.length} surah${g.rows.length===1?"":"s"} done</b> <span class="mute">· ${g.pct}% of the goal</span></p>
  ${g.next?`<p style="margin:6px 0 0;color:var(--g);font-weight:600">Next: ${esc(EN[g.next.s-1])}${g.next.whole?"":` ${g.next.from}–${g.next.to}`} (${g.next.n-g.next.h} ayat left)</p>`:`<p style="margin:6px 0 0;color:var(--g);font-weight:600">Goal complete, Alhamdulillah.</p>`}
  <details style="margin-top:10px"><summary class="mute" style="cursor:pointer">Surahs in this goal</summary><div class="list" style="margin-top:6px">${g.rows.map(r=>`<div class="it"><div>${esc(sname(r.s))}${r.whole?"":` <span class="mute">(ayat ${r.from}–${r.to})</span>`}<br><span class="mute">${r.h} of ${r.n} ayat</span></div><span class="pill ${r.h===r.n?"v":""}">${r.h===r.n?"done":Math.round(r.h/r.n*100)+"%"}</span></div>`).join("")}</div></details></div>`;
}

/* ---------- views ---------- */
const head=(sub,out)=>`<header><div class="brand">AH Hifdh Tracker<small>${sub}</small></div>${out?`<button class="ghost small" id="out">Log out</button>`:""}</header>`;
function home(){
  app.innerHTML=head("Al Hikmah Boys")+`<div class="card hadith"><div class="ar" style="font-size:30px">اقْرَأْ وَارْتَقِ</div><p>Recite and rise</p></div>
  <div class="choose"><button id="gp">I'm a parent</button><button class="ghost" id="gt">I'm the teacher</button></div>`;
  $("#gp").onclick=()=>parentLogin();$("#gt").onclick=()=>teacherLogin();
}
function parentLogin(){
  const s=S.get("par");if(s)return parentView(s);
  app.innerHTML=head("Parent login")+`<div class="card"><h2>Parent login</h2><p class="mute">Use the code and PIN the teacher gave you.</p>
  <label>Son's code</label><input id="pc" placeholder="AHB123" autocapitalize="characters"><label>PIN</label><input id="pp" type="password" inputmode="numeric" maxlength="8">
  <button id="pl" style="width:100%;margin-top:12px">Open</button><div class="err" id="pe"></div><p><a href="#" id="back">← Back</a></p></div>`;
  $("#back").onclick=e=>{e.preventDefault();home()};
  $("#pl").onclick=async()=>{const c={code:$("#pc").value.trim().toUpperCase(),pin:$("#pp").value.trim()};try{const d=await rpc("parent_get",{p_code:c.code,p_pin:c.pin});S.set("par",c);parentView(c,d)}catch(e){$("#pe").textContent=e.message}};
}
async function parentView(c,d){
  try{d=d||await rpc("parent_get",{p_code:c.code,p_pin:c.pin})}catch(e){S.del("par");return parentLogin()}
  app.innerHTML=head(esc(d.boy.name),1)+`<button id="lg" style="width:100%;margin-bottom:12px;padding:14px">+ Log today's Hifdh</button><div class="card" id="lgc" style="display:none"><h2>Log today's Hifdh</h2>${entryForm("pf",[["new","New lesson"],["revision","Revision"]])}<p class="mute" style="margin:8px 0 0">The teacher checks each entry before it counts.</p></div>`+dashboard(d.boy.name,d.entries,d.boy.goal);
  $("#out").onclick=()=>{S.del("par");home()};bindMap(d.entries);$("#lg").onclick=()=>{$("#lgc").style.display="block";$("#lg").style.display="none"};
  bindForm("pf",async v=>{const r=await rpc("parent_add_many",{p_code:c.code,p_pin:c.pin,p_items:v.items,p_mistakes:v.mistakes,p_date:v.date});toast("Saved. Waiting for teacher to verify.");parentView(c,r)});
}
async function teacherLogin(){
  const s=S.get("tch");if(s)return teacherView(s);
  let st;try{st=await rpc("teacher_status")}catch(e){app.innerHTML=head("")+`<div class="card err">${esc(e.message)}</div>`;return}
  app.innerHTML=head("Teacher")+`<div class="card"><h2>${st.setup?"Teacher login":"First-time setup"}</h2>${st.setup?"":"<p class='mute'>Choose a teacher PIN (at least 6 digits). Keep it private.</p>"}
  <label>Teacher PIN</label><input id="tp" type="password" inputmode="numeric">${st.setup?"":`<label>Repeat PIN</label><input id="tp2" type="password" inputmode="numeric">`}
  <button id="tl" style="width:100%;margin-top:12px">${st.setup?"Open":"Set PIN"}</button><div class="err" id="te"></div><p><a href="#" id="back">← Back</a></p></div>`;
  $("#back").onclick=e=>{e.preventDefault();home()};
  $("#tl").onclick=async()=>{const pin=$("#tp").value.trim();try{if(!st.setup){if(pin!==$("#tp2").value.trim())throw new Error("PINs don't match");await rpc("teacher_setup",{p_pin:pin})}
    const d=await rpc("teacher_get",{p_pin:pin});S.set("tch",pin);teacherView(pin,d)}catch(e){$("#te").textContent=e.message}};
}
let TAB="verify";
async function teacherView(pin,d){
  try{d=d||await rpc("teacher_get",{p_pin:pin})}catch(e){S.del("tch");return teacherLogin()}
  const pend=[];for(const b of d.boys)for(const e of b.entries)if(e.status==="pending")pend.push({...e,boy:b});
  pend.sort((a,b)=>a.date<b.date?-1:1);
  const tabs=`<div class="tabs"><button data-t="verify" class="${TAB==="verify"?"on":""}">To verify (${pend.length})</button><button data-t="boys" class="${TAB==="boys"?"on":""}">Boys (${d.boys.filter(b=>b.active).length})</button><button data-t="class" class="${TAB==="class"?"on":""}">Settings</button></div>`;
  let body="";
  if(TAB==="verify")body=pend.length?`${pend.length>1?`<button id="va" style="width:100%;margin-bottom:12px">Verify all ${pend.length} as entered</button>`:""}<div class="card list">${pend.map(e=>`<div class="it" style="flex-wrap:wrap"><div style="flex:1 1 200px"><b>${esc(e.boy.name)}</b> · ${e.kind==="new"?"New":"Revision"}<br>${esc(sname(e.surah))} ${e.from}–${e.to} <span class="mute">· ${e.date}</span></div>
    <div class="row" style="flex:0 0 auto;align-items:center"><input type="number" min="0" value="${e.mistakes}" data-mk="${e.id}" style="width:64px" title="Mistakes"><button class="small" data-v="${e.id}">Verify</button><button class="small ghost" data-r="${e.id}">Reject</button></div></div>`).join("")}</div>`
    :`<div class="card mute">Nothing waiting. All entries are verified.</div>`;
  if(TAB==="boys"){
    body=`<div class="card"><h2>Add a boy</h2><div class="row"><input id="nb" placeholder="Full name"><button id="ab" style="flex:0 0 auto">Add</button></div><div id="newcode"></div></div><div class="card list">`+
    d.boys.map(b=>{const m=model(b.entries);const lastD=b.entries.filter(e=>e.status==="verified"&&e.kind!=="prior").map(e=>dnum(e.date)).sort().pop();
      return `<div class="it" style="cursor:pointer" data-b="${b.id}"><div><b>${esc(b.name)}</b>${b.active?"":" <span class='pill'>inactive</span>"}<br><span class="mute">${(()=>{const g=goalProgress(b.goal,m.mem);return g?`Goal ${esc(b.goal.label)}: ${g.pct}% · `:"No goal · "})()}${fmt(m.full/20)} juz · this week ${fmt(m.cur.nw)} new pg · ${m.fading.length} fading · ${lastD?`last ${m.T-lastD}d ago`:"no sessions yet"}</span></div><span class="mute">›</span></div>`}).join("")+`</div>`;
  }
  if(TAB==="class")body=`<div class="card"><h2>Change teacher PIN</h2><div class="row"><input id="np" type="password" inputmode="numeric" placeholder="New PIN (6+ digits)"><button id="cp" style="flex:0 0 auto">Change</button></div></div>`;
  app.innerHTML=head("Teacher",1)+tabs+body;
  $("#out").onclick=()=>{S.del("tch");home()};
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;teacherView(pin,d)});
  app.querySelectorAll("[data-v],[data-r]").forEach(b=>b.onclick=async()=>{b.disabled=true;const id=+(b.dataset.v||b.dataset.r);
    try{const r=await rpc("teacher_review",{p_pin:pin,p_id:id,p_status:b.dataset.v?"verified":"rejected",p_mistakes:+app.querySelector(`[data-mk="${id}"]`).value||0});teacherView(pin,r)}catch(e){toast(e.message);b.disabled=false}});
  app.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>boyView(pin,d,x.dataset.b));
  if($("#va"))$("#va").onclick=async ev=>{if(!confirm(`Verify all ${pend.length} entries with the mistakes as entered?`))return;ev.target.disabled=true;try{teacherView(pin,await rpc("teacher_verify_many",{p_pin:pin,p_ids:pend.map(e=>e.id)}))}catch(e){toast(e.message);ev.target.disabled=false}};
  if($("#ab"))$("#ab").onclick=async()=>{try{const r=await rpc("teacher_add_boy",{p_pin:pin,p_name:$("#nb").value});const nm=$("#nb").value;const d2=await rpc("teacher_get",{p_pin:pin});teacherView(pin,d2);
    $("#newcode").innerHTML=`<p>Give these to ${esc(nm)}'s parent (shown once):</p><div class="row"><div><label>Code</label><div class="code">${r.code}</div></div><div><label>PIN</label><div class="code">${r.pin}</div></div></div>`}catch(e){toast(e.message)}};
  if($("#cp"))$("#cp").onclick=async()=>{const n=$("#np").value.trim();try{await rpc("teacher_change_pin",{p_pin:pin,p_new:n});S.set("tch",n);toast("PIN changed");teacherView(n)}catch(e){toast(e.message)}};
}
function boyView(pin,d,id){
  const b=d.boys.find(x=>x.id===id);if(!b)return teacherView(pin);
  let so="";for(let s=1;s<=114;s++)so+=`<option value="${s}">${sname(s)}</option>`;
  const hist=[...b.entries].reverse().slice(0,25);
  app.innerHTML=head(esc(b.name),1)+`<p><a href="#" id="bk">← All boys</a></p>
  <div class="card" id="ge"><details ${b.goal?"":"open"}><summary style="cursor:pointer;font-weight:700;font-size:17px">${b.goal?`Goal: ${esc(b.goal.label)} <span class="mute" style="font-weight:500">(tap to change)</span>`:`Set ${esc(b.name)}'s goal`}</summary><p class="mute" style="margin:8px 0 4px">Pick the portion and tap "Add to goal". Add as many portions as you need, then save.</p>
    ${selectors()}<button type="button" class="ghost" id="gadd" style="width:100%;margin-top:10px">+ Add to goal</button>
    <div id="glist" class="list" style="margin-top:8px;max-height:260px;overflow:auto"></div>
    <label>Goal name</label><input id="gname" placeholder="e.g. Juz 29 and 30">
    <div class="row" style="margin-top:10px"><button id="gsave">Save goal</button><button class="ghost" id="gclear">Remove goal</button></div><div class="err" id="gerr"></div></details></div>
  <div class="card"><h2>Add an entry</h2><p class="mute" style="margin:-4px 0 4px">Entries you add are verified straight away. Use "Already memorised" for what the boy knew before the tracker.</p>${entryForm("tf",[["new","New lesson"],["revision","Revision"],["prior","Already memorised (before tracker)"]])}</div>
  ${dashboard(b.name,b.entries,b.goal)}
  <div class="card"><h2>Weekly report for parent</h2><textarea id="wr" style="width:100%;height:170px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px">${esc(weeklyText(b.name,b.entries))}</textarea>
    <div class="row"><button id="cpy">Copy</button><a class="btn" style="text-align:center;text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(weeklyText(b.name,b.entries))}">WhatsApp</a></div></div>
  <div class="card"><h2>History</h2><div class="list">${hist.map(e=>`<div class="it"><div>${e.kind==="new"?"New":e.kind==="revision"?"Revision":"Already memorised"}: ${esc(EN[e.surah-1])} ${e.from}–${e.to}<br><span class="mute">${e.date} · ${e.mistakes} mistakes · by ${e.source}</span></div><div class="row" style="flex:0 0 auto;align-items:center"><span class="pill ${e.status==="verified"?"v":""}">${e.status}</span><button class="small ghost" data-del="${e.id}">Delete</button></div></div>`).join("")||"<p class='mute'>No entries yet.</p>"}</div></div>
  <div class="card"><h2>Parent access</h2><div class="row"><button class="ghost" id="rp">Reset parent PIN</button><button class="ghost" id="ia">${b.active?"Mark inactive":"Mark active"}</button></div><div id="rpo"></div><p class="mute">Code: <b>${b.code}</b></p></div>`;
  $("#bk").onclick=e=>{e.preventDefault();TAB="boys";teacherView(pin,d)};$("#out").onclick=()=>{S.del("tch");home()};bindMap(b.entries);
  const reload=r=>boyView(pin,r,id);
  let gitems=(b.goal&&b.goal.items)?b.goal.items.map(x=>({...x})):[],glabels=[];
  const gread=bindSelectors($("#ge"));$("#gname").value=b.goal?b.goal.label:"";
  const gdraw=()=>{const bys={};for(const it of gitems)(bys[it.surah]=bys[it.surah]||[]).push(it);
    $("#glist").innerHTML=gitems.length?Object.keys(bys).map(Number).sort((x,y)=>x-y).map(sn=>`<div class="it"><div>${esc(sname(sn))} <span class="mute">${bys[sn].map(i=>i.f===1&&i.t===Q.sc[sn-1]?"whole":`${i.f}–${i.t}`).join(", ")}</span></div><button class="small ghost" data-gx="${sn}">✕</button></div>`).join(""):`<p class="mute" style="margin:0">Nothing added yet.</p>`;
    $("#glist").querySelectorAll("[data-gx]").forEach(x=>x.onclick=()=>{gitems=gitems.filter(i=>i.surah!==+x.dataset.gx);gdraw()})};gdraw();
  $("#gadd").onclick=()=>{const r=gread("new");if(r.err){$("#gerr").textContent=r.err;return}$("#gerr").textContent="";
    for(const it of r.items)gitems.push({surah:it.surah,f:it.f,t:it.t});glabels.push(r.label);if(!$("#gname").value||!b.goal)$("#gname").value=glabels.join(", ");gdraw()};
  $("#gsave").onclick=async()=>{if(!gitems.length){$("#gerr").textContent="Add at least one portion first.";return}
    try{reload(await rpc("teacher_set_boy_goal",{p_pin:pin,p_boy:id,p_label:$("#gname").value,p_items:gitems}));toast("Goal saved")}catch(e){$("#gerr").textContent=e.message}};
  $("#gclear").onclick=async()=>{if(!confirm("Remove this boy's goal?"))return;try{reload(await rpc("teacher_set_boy_goal",{p_pin:pin,p_boy:id,p_label:"",p_items:[]}))}catch(e){toast(e.message)}};
  bindForm("tf",async v=>{const r=await rpc("teacher_add_many",{p_pin:pin,p_boy:id,p_items:v.items,p_mistakes:v.mistakes,p_date:v.date});toast("Saved");reload(r)});
  $("#cpy").onclick=()=>{navigator.clipboard.writeText($("#wr").value).then(()=>toast("Copied"),()=>{$("#wr").select();toast("Select and copy")})};
  app.querySelectorAll("[data-del]").forEach(x=>x.onclick=async()=>{if(!confirm("Delete this entry?"))return;try{reload(await rpc("teacher_delete",{p_pin:pin,p_id:+x.dataset.del}))}catch(e){toast(e.message)}});
  $("#rp").onclick=async()=>{if(!confirm("Create a new PIN? The old one will stop working."))return;try{const r=await rpc("teacher_reset_pin",{p_pin:pin,p_boy:id});$("#rpo").innerHTML=`<p>New PIN (shown once):</p><div class="code">${r.pin}</div>`}catch(e){toast(e.message)}};
  $("#ia").onclick=async()=>{try{reload(await rpc("teacher_update_boy",{p_pin:pin,p_boy:id,p_name:null,p_active:!b.active}))}catch(e){toast(e.message)}};
}
document.addEventListener("wheel",()=>{const a=document.activeElement;if(a&&a.type==="number")a.blur()},{passive:true});
home();
</script>
